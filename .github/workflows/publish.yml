name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "mojv_auth_helper/**"
      - "repository.yaml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gekon27/mojv-auth-helper

jobs:
  publish:
    name: Publish multi-arch helper image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read helper version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '$1 == "version" {gsub(/"/, "", $2); print $2}' mojv_auth_helper/config.yaml)"
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./mojv_auth_helper
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:amd64-${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
            BUILD_FROM=ghcr.io/home-assistant/base-python:3.13-alpine3.24
      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: ./mojv_auth_helper
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:aarch64-${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
            BUILD_FROM=ghcr.io/home-assistant/base-python:3.13-alpine3.24
      - name: Publish version and latest multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"
      - name: Verify manifest platforms
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > /tmp/manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in manifest.get('manifests', [])
          }
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          missing = required - platforms
          assert not missing, f'missing manifest platforms: {sorted(missing)}; got={sorted(platforms)}'
          PY
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
      - name: Verify anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker logout ghcr.io || true
          rm -f "$HOME/.docker/config.json"
          docker pull "${IMAGE}:${VERSION}"

# Retrigger marker after granting standalone repository GHCR Actions access.
